review:
  stage: pre-build
  image: clouddevops.azurecr.io/buildbox:10-latest
  tags:
    - linux-devops-docker-build
  script:
    - |
      #!/bin/bash
      comments=$(curl --header "PRIVATE-TOKEN: $AZURE_OPENAI_SHARPEYE_TOKEN" "https://git.avepoint.net/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes")
      if echo $comments | grep -q "\"username\":\"$AZURE_OPENAI_SHARPEYE_NAME\""; then
          echo "This MR has already been reviewed, it will not be reviewed again. skip."
          exit 0
      else
          echo "User $USERNAME has not commented. Proceeding with datagen."
          datagen cr --summarize --git-token $AZURE_OPENAI_SHARPEYE_TOKEN --project-id $CI_PROJECT_ID --pipeline-id $CI_PIPELINE_ID --llm-endpoint $AZURE_OPENAI_ENDPOINT --llm-deployment-name $AZURE_OPENAI_DEPLOYMENT_NAME --llm-key $AZURE_OPENAI_API_KEY
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ $IGNORE_PATTERN && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ $IGNORE_PATTERN && $AZURE_OPENAI_SHARPEYE_SKIP == null'


