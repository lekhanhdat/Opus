<!--Covered by AvePoint copyright and license agreement-->
<div class="topMessage">
    <div class="message-body message-body-width top-message">
        <div class="top-row-container">
            <div class="message-body-top-row padded-content" id="header">
                <!--Name-->
                <div class="account-name" data-tid="threadBodyDisplayName">
                    {0}
                </div>
                <div class="timestamp-column" data-tid="sending-state-2">
                    <!--Timestamps-->
                    <span class="ts-created message-datetime" data-tid="messageTimeStamp" title="{1}">
                        {2}
                    </span>
                </div>
            </div>
            <div class="reaction"></div>
        </div>
        <span class="message-body-important-text">{3}</span>
        <div class="announcement padded-content">
            {7}
        </div>
        <div class="thread-subject padded-content">{4}</div>
        <div data-tid="messageBodyContainer" class="message-body-container padded-content">
            <div data-tid="messageBodyContent" class="message-body-content clearfix html">
                {5}
            </div>
        </div>
        <div class="channel-message-reaction-summary padded-content">
            <div class="channel-message-reaction-tool-bar">
                {8}
            </div>
        </div>
    </div>
    <div>{6}</div>
</div>
