    <title>Team Conversation History</title>
    <style type="text/css">
        body {

            color: #252424;
            font-size: 1.4rem;

        }

            -webkit-tap-highlight-color: transparent;
            min-width: 720px;
            font-size: calc(1em * .625);

        }

        html {
            font-family: sans-serif;

        }

        dl, ol, ul {

        }

        }

            padding-right: 1.6rem;

        }

            color: #c4314b;

        blockquote {
            background-color: rgba(37,36,35,.05);

            padding: .7rem 1.6rem .7rem 1.1rem;
            border-left: .4rem solid #e1dfdd;
            margin-top: .5rem;
            margin-bottom: .5rem;
        }

        pre {
            padding: .5rem;
            background-color: rgba(37,36,35,.05);
            border-radius: .3rem;
        }

        table {
            border-spacing: 0;
            border-collapse: collapse;
        }

        .topMessage, .reply {
            position: relative;
        }

        .top-row-container {
            display: flex;
            padding-right: 1.6rem;
        }

        .reaction-size {
            height: 1.6rem;
            width: 1.6rem;
        }

        .wrapper {
            border-radius: 50%;
            overflow: hidden;
            background-clip: content-box;
            height: 3.2rem;
            width: 3.2rem;
        }

            .wrapper img {
                max-width: 100%;
                min-height: 100%;

        .media-object {

        }

        }

        .emotion-icon-renderer {

            min-width: 20px;

        .emotion-icon-renderer > img {

    <style>
        .app-svg {
            height: 3.2rem;

        .icons-unfilled {
            fill: #484644;
        }

        svg {
            margin-left: -.4rem;

        .action-marker {
            border-radius: 50%;

            position: absolute;

            top: .7rem;
            right: -1.2rem;
            z-index: 2;

        }

    <script>
        function init() {
            var messages = document.getElementsByClassName("message-body");
            for (i = 0; i < messages.length; i++) {
                //change left border color to red for important message
                if (messages[i].getElementsByClassName("message-body-important-text")[0].innerText.toUpperCase() == "IMPORTANT!") {
                    messages[i].style.borderLeftColor = "#c4314b";
                }
                //sweetheart easter egg
                if (messages[i].innerHTML.toLowerCase().indexOf("sweetheart") >= 0) {
                    messages[i].getElementsByClassName("reaction")[0].innerHTML = "<img class='reaction-size' src='https://statics.teams.cdn.office.net/evergreen-assets/skype/v2/heart/20.png?v=4'>";
                }
            }
        }
    </script>
